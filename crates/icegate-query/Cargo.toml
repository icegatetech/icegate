[package]
name = "icegate-query"
description = "Query APIs for IceGate (Loki, Prometheus, Tempo, Flight SQL)"
readme = "README.md"
keywords = ["iceberg", "datafusion", "logql", "flight-sql"]
categories = ["database"]
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "query"
path = "src/main.rs"

[dependencies]
icegate-common = { workspace = true, features = ["shed-tonic"] }
icegate-queue = { workspace = true }
parquet = { workspace = true }
bytes = { workspace = true }

# ANTLR parser
antlr4rust = { workspace = true }

# Iceberg
iceberg = { workspace = true }
iceberg-datafusion = { workspace = true }

# DataFusion
datafusion = { workspace = true }
datafusion-tracing = { workspace = true }
datafusion-flight-sql-server = { workspace = true }

# Arrow Flight (gRPC transport for Flight SQL)
arrow-flight = { workspace = true }

# gRPC server
tonic = { workspace = true }
tokio-stream = { workspace = true }
# Middleware of our own: the Flight SQL response-body deadline layer
# (`infra::deadline`) implements tower's `Layer`/`Service` over `http` bodies.
tower = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }

# Object storage
object_store = { workspace = true }

# Async utilities
futures = { workspace = true }
async-trait = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }

# CLI
clap = { workspace = true }

regex = { workspace = true }

# Configuration
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP server
axum = { workspace = true }
axum-extra = { workspace = true }
tower-http = { workspace = true }

# Logging
tracing = { workspace = true }

# Metrics
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }

# OTLP protobuf encoding for Tempo trace-by-ID responses
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
hex = { workspace = true }

# Date and time
chrono = { workspace = true }

# Utilities
itoa = { workspace = true }
tikv-jemallocator = { workspace = true }

[[bench]]
name = "loki_queries"
harness = false

[dev-dependencies]
reqwest = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }
tower = { workspace = true, features = ["util"] }
# Body combinators (`BodyExt`) used to drive the deadline layer's bodies in tests.
http-body-util = "0.1"
# `test-util` enables the paused-clock (`start_paused`) test runtime the response
# deadline tests run on, so a 30 s deadline costs no wall-clock time.
tokio = { workspace = true, features = ["test-util"] }
