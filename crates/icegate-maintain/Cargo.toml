 [package]
name = "icegate-maintain"
description = "Maintenance operations for IceGate"
readme = "../../README.md"
keywords = ["iceberg", "maintenance", "migration", "observability"]
categories = ["database"]
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "maintain"
path = "src/main.rs"

[dependencies]
icegate-common = { workspace = true }
icegate-jobmanager = { path = "../icegate-jobmanager" }

# Iceberg
iceberg = { workspace = true }

# Arrow ecosystem
arrow = { workspace = true }
parquet = { workspace = true }
object_store = { workspace = true }

# URL parsing: reduce Iceberg's absolute file URIs to bucket-relative object keys
url = { workspace = true }

# HTTP: the pricing crawler fetches rate cards from upstream JSON endpoints.
# `stream` enables `bytes_stream()`, used to enforce the response size cap
# before buffering rather than after.
reqwest = { workspace = true, features = ["stream"] }
# Named directly (not just pulled in transitively via reqwest) so the response-cap
# helper can be typed over `bytes::Bytes` and exercised with a synthetic stream in
# unit tests, without a network round trip.
bytes = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# CLI
clap = { workspace = true }

# Configuration
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }

# Pattern matching: the LiteLLM source detects context-tier fields by name
# (`input_cost_per_token_above_<N>k_tokens`) since the boundary is dynamic.
regex = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Metrics: compaction instruments record to the globally-installed meter
# provider (no-op when none is set), mirroring ingest's shift metrics.
opentelemetry = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }

# Memory allocator: the long-running `run` compaction service retains memory
# across many rewrite cycles, so use jemalloc (as ingest/query do) to avoid the
# glibc-malloc arena fragmentation that otherwise grows container RSS without
# bound. Only linked on Linux; see the `#[global_allocator]` in `main.rs`.
tikv-jemallocator = { workspace = true }

[dev-dependencies]
icegate-common = { workspace = true, features = ["testing"] }
# Integration tests seed tables over object storage through the concrete S3 catalog and
# then drive compaction against it as an `Arc<dyn Catalog>`.
icegate-catalog-s3 = { workspace = true }
testcontainers = { workspace = true }
