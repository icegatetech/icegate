[package]
name = "icegate-ingest"
description = "OTLP data ingestion for IceGate"
readme = "../../README.md"
keywords = ["iceberg", "otlp", "opentelemetry", "observability"]
categories = ["database"]
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "ingest"
path = "src/main.rs"

[dependencies]
icegate-common = { workspace = true, features = ["shed-tonic"] }
icegate-queue = { path = "../icegate-queue" }
jobmanager = { workspace = true }

# Apache Arrow
arrow = { workspace = true }
parquet = { workspace = true }

# Iceberg
iceberg = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }

# Configuration
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
hex = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
object_store = { workspace = true }
tikv-jemallocator = { workspace = true }

# HTTP server
axum = { workspace = true }
tower-http = { workspace = true }

# gRPC server
tonic = { workspace = true }
prost = { workspace = true }
opentelemetry-proto = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }

# Metrics
opentelemetry-instrumentation-tokio = { workspace = true }

# Logging
tracing = { workspace = true }

# CLI
clap = { workspace = true }

# Async utils
async-trait = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
# The shift end-to-end test drives the production assembly against a real object store, which the
# `testing` feature provides (container bootstrap plus bucket/object-store helpers).
icegate-common = { workspace = true, features = ["testing", "shed-tonic"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
flate2 = "1"
zstd = "0.13"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# `test-util` enables the paused-clock (`start_paused`) test runtime used to
# exercise the WAL ack-timeout backpressure path without real-time waits.
tokio = { workspace = true, features = ["test-util"] }
