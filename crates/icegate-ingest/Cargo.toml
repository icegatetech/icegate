[package]
name = "icegate-ingest"
description = "OTLP data ingestion for IceGate"
readme = "../../README.md"
keywords = ["iceberg", "otlp", "opentelemetry", "observability"]
categories = ["database"]
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[lints]
workspace = true

[features]
# Enable the tokio-console instrumentation layer for the ingest binary. Build the
# image with this feature to profile async task poll times / detect reactor
# stalls. Requires `--cfg tokio_unstable` (already set in the container images).
# Off by default (debug/profiling tool with runtime overhead).
tokio-console = ["icegate-common/tokio-console"]

[[bin]]
name = "ingest"
path = "src/main.rs"

[dependencies]
icegate-common = { workspace = true }
icegate-jobmanager = { path = "../icegate-jobmanager" }
icegate-queue = { path = "../icegate-queue" }

# Apache Arrow
arrow = { workspace = true }
parquet = { workspace = true }

# Iceberg
iceberg = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }

# Configuration
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
hex = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
object_store = { workspace = true }
tikv-jemallocator = { workspace = true }

# HTTP server
axum = { workspace = true }
tower-http = { workspace = true }

# gRPC server
tonic = { workspace = true }
prost = { workspace = true }
opentelemetry-proto = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }

# Metrics
opentelemetry-instrumentation-tokio = { workspace = true }

# Logging
tracing = { workspace = true }

# CLI
clap = { workspace = true }

# Async utils
async-trait = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
flate2 = "1"
zstd = "0.13"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# `test-util` enables the paused-clock (`start_paused`) test runtime used to
# exercise the WAL ack-timeout backpressure path without real-time waits.
tokio = { workspace = true, features = ["test-util"] }
