# Rust formatting configuration for IceGate
# https://rust-lang.github.io/rustfmt/

# Edition
edition = "2024"

# Ignore
ignore = [
    "crates/icegate-query/src/logql/antlr/",
    "!crates/icegate-query/src/logql/antlr/mod.rs",
    "!crates/icegate-query/src/logql/antlr/tests.rs",
    "!crates/icegate-query/src/logql/antlr/visitors.rs",
    "crates/icegate-query/src/traceql/antlr/",
    "!crates/icegate-query/src/traceql/antlr/mod.rs",
    "!crates/icegate-query/src/traceql/antlr/tests.rs",
    "!crates/icegate-query/src/traceql/antlr/visitors.rs",
    "crates/icegate-query/src/query_dsl/analyzer/word_break_tables.rs",
    "crates/icegate-query/src/query_dsl/analyzer/lowercase_table.rs",
    "crates/icegate-query-grammar/src/lucene/",
    "!crates/icegate-query-grammar/src/lucene/mod.rs",
    "!crates/icegate-query-grammar/src/lucene/tests.rs",
    "crates/icegate-query-grammar/src/ppl/",
    "!crates/icegate-query-grammar/src/ppl/mod.rs",
    "!crates/icegate-query-grammar/src/ppl/char_stream.rs",
    "!crates/icegate-query-grammar/src/ppl/tests.rs",
]

# Basic formatting
max_width = 120
chain_width = 80
reorder_imports = true

format_code_in_doc_comments = true
group_imports = "StdExternalCrate"
