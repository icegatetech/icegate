name: Helm Lint

on:
  push:
    branches: [ main ]
    paths:
      - 'config/helm/**'
      - 'Makefile'
      - '.github/workflows/helm-lint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'config/helm/**'
      - 'Makefile'
      - '.github/workflows/helm-lint.yml'
  workflow_dispatch:

jobs:
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4.3.0
        with:
          version: v4.1.0

      - name: Install helm-docs
        run: |
          VERSION=1.14.2
          curl -fsSL -o /tmp/helm-docs.tar.gz \
            "https://github.com/norwoodj/helm-docs/releases/download/v${VERSION}/helm-docs_${VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/helm-docs.tar.gz -C /tmp helm-docs
          sudo install -m 0755 /tmp/helm-docs /usr/local/bin/helm-docs

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Lint chart
        run: helm lint config/helm/icegate

      - name: Template chart
        run: make helm-template

      - name: Template catalog server
        run: make helm-catalog-test

      - name: Template REST backend guard
        run: make helm-rest-uri-test

      - name: Check Artifact Hub metadata
        run: make helm-metadata-test
