[advisories]
ignore = [
    "RUSTSEC-2024-0436", # `paste` is unmaintained; consider using an alternative
    "RUSTSEC-2025-0134", # `rustls-pemfile`, is unmaintained
    # bincode 1.x is pulled in transitively via foyer/iceberg; this advisory is tracked as an unmaintained dependency warning, not a known vulnerability in our direct code.
    "RUSTSEC-2025-0141",
    # TODO: rustls-webpki 0.101.7 CRL matching flaw; transitive via aws-smithy-http-client -> rustls 0.21. Remove once AWS SDK drops legacy rustls.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0185",  # `quinn-proto` via `testcontainers`, wait for new version
    # quick-xml <0.41 DoS pair (both fixed in >=0.41.0): 0194 quadratic-time
    # duplicate-attribute check, 0195 unbounded namespace-declaration allocation.
    # Transitive only, via object_store / opendal / reqsign parsing S3 XML responses;
    # input comes from our trusted object store, not from an attacker. No upstream fix
    # is reachable yet: even the latest object_store 0.14.0 still pins quick-xml ^0.40.1
    # (also <0.41). Remove once object_store ships quick-xml >=0.41 and we bump the
    # object_store/datafusion/parquet stack to match.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # h2 unbounded empty DATA frames, patched only in >=0.4.16. The 0.4.x copy is
    # updated; the remaining hit is h2 0.3.27, which no version bump can reach:
    # aws-sdk-s3's default `rustls` feature turns on aws-smithy-runtime's
    # `connector-hyper-0-14-x`, and that pins hyper 0.14 + h2 0.3. Dropping
    # default features on our side would not remove it either — `jobmanager` and
    # the iceberg AWS catalogs pull the same crates with defaults, and Cargo
    # unions features across the graph. Nothing configures the legacy hyper-0.14
    # connector, so the default HTTPS client stays on hyper 1.x + h2 0.4.
    # Remove once the AWS SDK drops the hyper-0.14 connector.
    "RUSTSEC-2026-0258",
    # rustls client advisories patched only in >=0.23.46. The 0.23.x copy (ours and
    # the AWS SDK's default HTTPS client) is at that floor — the workspace pins
    # `rustls = "0.23.46"`. The remaining hit is rustls 0.21.12, which has no patched
    # release: aws-smithy-http-client pulls it for the same legacy hyper-0.14
    # connector as RUSTSEC-2026-0258 above, which nothing configures. 0346 needs a
    # custom `ClientSessionStore` that formats session values with `Debug`; nothing
    # implements one. 0349 downgrades post-quantum hybrid key exchange, which
    # rustls 0.21 does not offer.
    # Remove together with RUSTSEC-2026-0258.
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",
    # rustls-webpki accepting distrusted intermediates, patched only in >=0.103.16.
    # The 0.103.x copy is updated; the remaining hit is rustls-webpki 0.101.7, which
    # rustls 0.21.12 pins and which has no patched release — the same legacy
    # hyper-0.14 connector as RUSTSEC-2026-0258, which nothing configures. Remove
    # together with RUSTSEC-2026-0258.
    "RUSTSEC-2026-0382",
    # zstd 0.13 / zstd-safe 7.x advisories, patched only in zstd >=0.14.3 and
    # zstd-safe >=8.2.0. The 0.14 / 8.x copy (async-compression, which decodes
    # OTLP HTTP request bodies) is updated. The remaining copy is zstd 0.13.3,
    # which has no patched release; arrow-ipc, parquet, datafusion, iceberg,
    # foyer-storage and apache-avro pull it, and even the latest apache-avro
    # still requires zstd ^0.13. None of them reaches an affected function:
    # 0391 needs `stream::raw::{Encoder,Decoder}::with_context`, but they all
    # build streams with `new`, which owns a fresh context. 0403 needs
    # `stream::write::Decoder`; they decode through `stream::read::Decoder`,
    # `decode_all` or `bulk::Decompressor`. 0398 needs the `seekable` feature,
    # which nothing enables. Remove once zstd 0.13 leaves the dependency tree.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
]
