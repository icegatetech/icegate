apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../crds
  # Namespace "icegate" is created by the IceGate Helm chart (namespace.create: true
  # in values-icegate.yaml). This secret depends on that chart being rendered in
  # the same kustomize build.
  - secret-aws.yaml
  - job-rustfs-init.yaml

helmGlobals:
  chartHome: ../../../helm

helmCharts:
  - name: rustfs
    repo: https://charts.rustfs.com/
    version: 0.8.0
    releaseName: rustfs
    namespace: infra
    valuesFile: values-rustfs.yaml

  - name: icegate
    releaseName: icegate
    namespace: icegate
    valuesFile: values-icegate.yaml

patches:
  # The RustFS chart ships an unconditional `helm.sh/hook: test` Pod
  # (rustfs-test-connection). kustomize renders hooks via `helm template`, so it
  # is applied as a plain Pod and fails deploy stabilization by wget-ing RustFS
  # before it is ready. The chart exposes no flag to disable it, so drop it here.
  - target:
      kind: Pod
      name: rustfs-test-connection
      namespace: infra
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Pod
      metadata:
        name: rustfs-test-connection
        namespace: infra
