catalog:
  backend: !s3
    warehouse: catalog
  warehouse: s3://warehouse/
  properties:
    bucket: warehouse
    region: us-east-1
    endpoint: http://minio:9000
    # Catalog creds are set inline (unlike storage, which uses AWS_* env) to
    # de-risk first run: the catalog's S3 client and its FileIO are a separate
    # path from storage, so explicit dev creds guarantee both are authenticated.
    access_key_id: minioadmin
    secret_access_key: minioadmin
  cache:
    memory_size_mb: 1024
    disk_dir: /tmp/icegate/cache
    disk_size_mb: 4096

engine: {}

queue:
  common:
    base_path: s3://queue/

storage:
  backend: !s3
    bucket: warehouse
    region: us-east-1
    endpoint: http://minio:9000

loki:
  enabled: true
  host: 0.0.0.0
  port: 3100

prometheus:
  enabled: true
  host: 0.0.0.0
  port: 9090

tempo:
  enabled: true
  host: 0.0.0.0
  port: 3200

flight_sql:
  enabled: true
  host: 0.0.0.0
  port: 8815
  max_message_size: 16777216

tracing:
  enabled: true
  service_name: icegate-query
  otlp_endpoint: http://jaeger:4317
  sample_ratio: 1.0

metrics:
  enabled: true
  host: 0.0.0.0
  port: 9091
