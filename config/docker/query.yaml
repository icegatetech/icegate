catalog:
  backend: !s3
    warehouse: catalog
  warehouse: s3://warehouse/
  properties:
    bucket: warehouse
    region: us-east-1
    endpoint: http://s3:9000
    # Catalog creds are set inline (unlike storage, which uses AWS_* env) to
    # de-risk first run: the catalog's S3 client and its FileIO are a separate
    # path from storage, so explicit dev creds guarantee both are authenticated.
    access_key_id: rustfsadmin
    secret_access_key: rustfsadmin
  cache:
    memory_size_mb: 1024
    disk_dir: /tmp/icegate/cache
    disk_size_mb: 4096

# Hard ceiling on one query's wall clock, enforced on Loki, Prometheus, Tempo and
# Flight SQL. Together with `max_age_secs` (left at the icegate-query default) it
# bounds how long a query can outlive the catalog provider it was planned
# against, and so how far behind the committed WAL boundary a live reader can be.
engine:
  max_query_duration_secs: 30

queue:
  common:
    base_path: s3://queue/

storage:
  backend: !s3
    bucket: warehouse
    region: us-east-1
    endpoint: http://s3:9000

loki:
  enabled: true
  host: 0.0.0.0
  port: 3100

prometheus:
  enabled: true
  host: 0.0.0.0
  port: 9090

tempo:
  enabled: true
  host: 0.0.0.0
  port: 3200

flight_sql:
  enabled: true
  host: 0.0.0.0
  port: 8815
  max_message_size: 16777216

tracing:
  enabled: true
  service_name: icegate-query
  otlp_endpoint: http://jaeger:4317
  sample_ratio: 1.0

metrics:
  enabled: true
  host: 0.0.0.0
  port: 9091
