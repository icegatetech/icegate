# One tenant for the whole stand, named `demo`, because that is what the
# collector sends: `X-Scope-OrgID: demo` in otel-collector/config.yaml, on the
# logs of every service that uses the fluentd driver. In single mode a header
# naming any other tenant is rejected, so `default` here would 400 every batch.
# `otelgen` (profile `load`) sends no header at all and therefore also lands in
# `demo`; view its data through the "Loki (demo)" / "Tempo (demo)" datasources.
tenant: !single
  id: demo

catalog:
  backend: !s3
    warehouse: catalog
  warehouse: s3://warehouse/
  properties:
    bucket: warehouse
    region: us-east-1
    endpoint: http://s3:9000
    # Catalog creds are set inline (unlike storage, which uses AWS_* env) to
    # de-risk first run: the catalog's S3 client and its FileIO are a separate
    # path from storage, so explicit dev creds guarantee both are authenticated.
    access_key_id: rustfsadmin
    secret_access_key: rustfsadmin

storage:
  backend: !s3
    bucket: warehouse
    region: us-east-1
    endpoint: http://s3:9000

queue:
  common:
    base_path: s3://queue/
  write:
    flush_interval_ms: 200

shift:
  jobsmanager:
    storage:
      endpoint: http://s3:9000
      bucket: jobs
      prefix: shifter
      region: us-east-1
      job_state_codec: json
      request_timeout_secs: 5

otlp_http:
  enabled: true
  host: 0.0.0.0
  port: 4318

otlp_grpc:
  enabled: true
  host: 0.0.0.0
  port: 4317

metrics:
  enabled: true
  host: 0.0.0.0
  port: 9091
  path: /metrics

# Server-side TLS for every listener of this service, `/metrics` and `/health`
# included. Off while this block is absent: the stand serves plaintext. To turn
# it on, mount a directory holding both PEM files into the container, uncomment
# the block, and move this service's Compose healthcheck and Prometheus scrape
# (prometheus/prometheus.yml) to https.
# `reload_interval_secs` is optional; keys and defaults: `icegate_common::listener::TlsConfig`.
# tls:
#   certificate_path: /etc/icegate-tls/tls.crt
#   private_key_path: /etc/icegate-tls/tls.key
#   reload_interval_secs: 60

tracing:
  enabled: true
  service_name: icegate-ingest
  otlp_endpoint: http://jaeger:4317
  sample_ratio: 1.0
