# Envoy auth proxy for the dev stand (docker-compose.proxy.yml).
#
# This repository deploys no token issuer, so the issuer-specific values below
# are placeholders and must be pointed at yours before the stand accepts a real
# token. The host `issuer.example` sits under the TLD RFC 2606 reserves for
# documentation and does not resolve, so a forgotten substitution fails the JWKS
# fetch here instead of reaching some other network. What to replace:
#
#   - the `ingest_token` provider: `issuer`, `audiences`, and
#     `remote_jwks.http_uri.uri`;
#   - the `ingest_tokens_only` policy: the payload `typ` it matches, which is the
#     issuer's own discriminator of which application token this is, and the JOSE
#     `typ` it matches beside it, which says the bearer is an access token. The
#     chart carries them as `ingest.authProxy.jwt.tokenType` and
#     `ingest.authProxy.jwt.headerType`; here they are literals because this file
#     is not templated;
#   - the `token_issuer_jwks` cluster: the endpoint `address`, the `sni`, and the
#     SAN matcher under `match_typed_subject_alt_names` — all three name the JWKS
#     host, and the last two are what authenticate it;
#   - the `timeout` on both routes, the ceiling on how long the proxy waits for
#     icegate to answer one OTLP request. The chart carries it as
#     `ingest.authProxy.upstreamTimeout` and this file repeats its default.
#
# The listeners below deliberately do NOT terminate TLS, unlike the ones the Helm
# chart renders (`config/helm/icegate/templates/configmap-authproxy.yaml`, where
# each filter chain carries a `DownstreamTlsContext`): the stand is local and
# deploys no certificate, so it takes the ingest token over plain HTTP. Copying
# this file into a deployment therefore requires adding that `transport_socket`
# first — without it the bearer token is readable on the wire.

static_resources:
  listeners:
    - name: otlp_http
      address:
        socket_address: { address: 0.0.0.0, port_value: 4318 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: otlp_http
                codec_type: AUTO
                route_config:
                  name: otlp_http
                  virtual_hosts:
                    - name: otlp_http
                      domains: ["*"]
                      routes:
                        # Every path; same reason as the chart's otlp_http listener.
                        - match: { prefix: / }
                          route: { cluster: icegate_otlp_http, timeout: "30s" }
                http_filters: &ingest_token_filters
                  # Drops whatever the client sent as x-scope-orgid, before
                  # jwt_authn writes the value from the token. A filter, and this
                  # one first, because route-level request_headers_to_remove is
                  # applied by the router filter at the end of the chain and would
                  # delete the value the token put there. Same order the chart
                  # renders in icegate.authProxyHttpFilters.
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: x-scope-orgid
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        ingest_token:
                          issuer: "https://issuer.example"
                          audiences: ["icegate-ingest"]
                          forward: false
                          # Both halves of the token reach the rbac policy below,
                          # which is the only filter that reads either. Same keys
                          # the chart's icegate.authProxyHttpFilters renders.
                          header_in_metadata: jwt_header
                          payload_in_metadata: jwt_payload
                          clock_skew_seconds: 60
                          # The only place a token is taken from; with no
                          # extractor named, jwt_authn also accepts an
                          # `access_token` query parameter, and a URL is written
                          # to access logs and traces by everything it passes
                          # through.
                          from_headers:
                            - name: Authorization
                              value_prefix: "Bearer "
                          claim_to_headers:
                            - header_name: x-scope-orgid
                              claim_name: tenant_id
                          remote_jwks:
                            http_uri:
                              uri: "https://issuer.example/.well-known/jwks.json"
                              cluster: token_issuer_jwks
                              timeout: 5s
                            cache_duration: "300s"
                            async_fetch: {}
                      rules:
                        - match: { prefix: / }
                          requires: { provider_name: ingest_token }
                  # The two markers of the token profile, neither of which
                  # jwt_authn checks and neither of which the audience stands in
                  # for: the JOSE `typ` of the header, which says the object is
                  # an access token, and the payload `typ`, the issuer's own
                  # discriminator of which application token this is.
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          # `principals.metadata` is marked deprecated by Envoy
                          # 1.36 (it still loads, with a warning); see the same
                          # note in the chart's icegate.authProxyHttpFilters.
                          ingest_tokens_only:
                            permissions:
                              - any: true
                            principals:
                              - and_ids:
                                  ids:
                                    - metadata:
                                        filter: envoy.filters.http.jwt_authn
                                        path:
                                          - key: jwt_header
                                          - key: typ
                                        value:
                                          string_match: { exact: "at+jwt" }
                                    - metadata:
                                        filter: envoy.filters.http.jwt_authn
                                        path:
                                          - key: jwt_payload
                                          - key: typ
                                        value:
                                          string_match: { exact: ingest }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: otlp_grpc
      address:
        socket_address: { address: 0.0.0.0, port_value: 4317 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: otlp_grpc
                codec_type: HTTP2
                route_config:
                  name: otlp_grpc
                  virtual_hosts:
                    - name: otlp_grpc
                      domains: ["*"]
                      routes:
                        - match: { prefix: /opentelemetry.proto.collector. }
                          route: { cluster: icegate_otlp_grpc, timeout: "30s" }
                http_filters: *ingest_token_filters

  clusters:
    - name: icegate_otlp_http
      connect_timeout: 1s
      type: STATIC
      load_assignment:
        cluster_name: icegate_otlp_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 14318 }
    - name: icegate_otlp_grpc
      connect_timeout: 1s
      type: STATIC
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: icegate_otlp_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 14317 }
    - name: token_issuer_jwks
      connect_timeout: 2s
      type: LOGICAL_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: token_issuer_jwks
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: issuer.example, port_value: 443 }
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: issuer.example
          # The signing keys decide who may write into a tenant, so the host that
          # serves them is authenticated rather than merely encrypted to. Same
          # reason as the chart's token_issuer_jwks cluster; the CA path is the
          # one in the envoyproxy/envoy image.
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt
              match_typed_subject_alt_names:
                - san_type: DNS
                  matcher:
                    exact: issuer.example
