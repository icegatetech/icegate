# Ingest behind the Envoy auth proxy (docker-compose.proxy.yml overlay).
#
# Differs from ingest.yaml in exactly two ways, both consequences of the proxy
# standing in front:
#   - `!multi`: the tenant comes from x-scope-orgid, which the proxy writes from
#     the ingest token's tenant_id claim after dropping whatever the client sent;
#   - the OTLP listeners move to the pod loopback, because the proxy owns the
#     published 4317/4318. Same split the chart renders under
#     ingest.authProxy.enabled.
tenant: !multi

catalog:
  backend: !s3
    warehouse: catalog
  warehouse: s3://warehouse/
  properties:
    bucket: warehouse
    region: us-east-1
    endpoint: http://s3:9000
    # Catalog creds are set inline (unlike storage, which uses AWS_* env) to
    # de-risk first run: the catalog's S3 client and its FileIO are a separate
    # path from storage, so explicit dev creds guarantee both are authenticated.
    access_key_id: rustfsadmin
    secret_access_key: rustfsadmin

storage:
  backend: !s3
    bucket: warehouse
    region: us-east-1
    endpoint: http://s3:9000

queue:
  common:
    base_path: s3://queue/
  write:
    flush_interval_ms: 200

shift:
  jobsmanager:
    storage:
      endpoint: http://s3:9000
      bucket: jobs
      prefix: shifter
      region: us-east-1
      job_state_codec: json
      request_timeout_secs: 5

otlp_http:
  enabled: true
  host: 127.0.0.1
  port: 14318

otlp_grpc:
  enabled: true
  host: 127.0.0.1
  port: 14317

metrics:
  enabled: true
  host: 0.0.0.0
  port: 9091
  path: /metrics

tracing:
  enabled: true
  service_name: icegate-ingest
  otlp_endpoint: http://jaeger:4317
  sample_ratio: 1.0
