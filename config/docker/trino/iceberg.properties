connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://catalog:8181

# No `iceberg.rest-catalog.warehouse`: a client that names a warehouse on
# `GET /v1/config` is answered with `NoSuchWarehouseException` unless the value
# matches the one this single-warehouse server announces (see
# `api/handlers.rs::get_config`, pinned by `rest_api_test.rs`). Left out, the
# request returns that warehouse in `overrides` anyway.

# The tables carry catalog properties beyond the Iceberg spec's own set; they
# are owned by `icegate-maintain/src/migrate/{config,operations}.rs`.
iceberg.allowed-extra-properties=*

# Trino's own access to the data files, independent of the catalog above.
fs.native-s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=rustfsadmin
s3.aws-secret-key=rustfsadmin
