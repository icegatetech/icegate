{{- if .Values.ingest.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "icegate.componentName" (dict "context" . "component" "ingest") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "icegate.componentLabels" (dict "context" . "component" "ingest") | nindent 4 }}
spec:
  replicas: {{ .Values.ingest.replicaCount }}
  selector:
    matchLabels:
      {{- include "icegate.selectorLabels" (dict "context" . "component" "ingest") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-ingest.yaml") . | sha256sum }}
        {{- if .Values.ingest.authProxy.enabled }}
        checksum/authproxy-config: {{ include (print $.Template.BasePath "/configmap-authproxy.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "icegate.componentLabels" (dict "context" . "component" "ingest") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "icegate.serviceAccountName" . }}
      securityContext:
        {{- include "icegate.podSecurityContext" . | nindent 8 }}
      {{- include "icegate.waitForDeps" (dict "context" . "config" .Values.ingest.waitForDependencies) | nindent 6 }}
      containers:
        - name: ingest
          image: {{ include "icegate.image" (dict "image" .Values.ingest.image "tag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
          command:
            - /usr/local/bin/entrypoint
            - run
            - --config
            - /etc/icegate/ingest.yaml
          securityContext:
            {{- include "icegate.containerSecurityContext" . | nindent 12 }}
          ports:
            {{- /* Port names are unique across the pod, so the published OTLP
                   names belong to whichever container actually listens on them:
                   the proxy when it is enabled, this container otherwise. The
                   loopback ports icegate falls back to are not declared at all —
                   nothing outside the pod can address them. */}}
            {{- if not .Values.ingest.authProxy.enabled }}
            {{- if .Values.ingest.otlpGrpc.enabled }}
            - name: otlp-grpc
              containerPort: {{ .Values.ingest.otlpGrpc.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.ingest.otlpHttp.enabled }}
            - name: otlp-http
              containerPort: {{ .Values.ingest.otlpHttp.port }}
              protocol: TCP
            {{- end }}
            {{- end }}
            {{- /* Declared unconditionally: the operational listener runs
                   whatever ingest.metrics.enabled says, because the probes hit
                   /health on it. */}}
            - name: metrics
              containerPort: {{ .Values.ingest.metrics.port }}
              protocol: TCP
          env:
            {{- include "icegate.awsEnv" . | nindent 12 }}
            - name: RUST_LOG
              value: {{ .Values.ingest.rustLog | quote }}
            - name: OTEL_SERVICE_NAME
              value: icegate-ingest
            {{- with .Values.ingest.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.ingest.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ingest.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.ingest.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/icegate
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.ingest.cache.enabled }}
            - name: cache
              mountPath: {{ .Values.ingest.cache.diskDir }}
            {{- end }}
        {{- if .Values.ingest.authProxy.enabled }}
        # Terminates TLS on the published OTLP ports, verifies the ingest token,
        # and rewrites x-scope-orgid from its tenant_id claim. icegate itself
        # listens on the pod loopback while this container runs.
        - name: auth-proxy
          image: {{ include "icegate.image" (dict "image" .Values.ingest.authProxy.image "tag" "v1.36.10") }}
          imagePullPolicy: {{ .Values.ingest.authProxy.image.pullPolicy }}
          command:
            - /usr/local/bin/envoy
            - --config-path
            - /etc/envoy/envoy.yaml
          securityContext:
            {{- include "icegate.containerSecurityContext" . | nindent 12 }}
          ports:
            {{- if .Values.ingest.otlpGrpc.enabled }}
            - name: otlp-grpc
              containerPort: {{ .Values.ingest.otlpGrpc.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.ingest.otlpHttp.enabled }}
            - name: otlp-http
              containerPort: {{ .Values.ingest.otlpHttp.port }}
              protocol: TCP
            {{- end }}
          {{- /* icegate's own probes report icegate, so a proxy that died while
                 its container stayed up would leave the pod Ready with nothing
                 answering on the published ports. tcpSocket rather than httpGet:
                 jwt_authn covers `prefix: /` of both listeners, so every HTTP
                 path here demands a token, and the proxy exposes no endpoint of
                 its own — the configuration renders no admin interface. */}}
          {{- if or .Values.ingest.otlpHttp.enabled .Values.ingest.otlpGrpc.enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ ternary "otlp-http" "otlp-grpc" .Values.ingest.otlpHttp.enabled }}
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: {{ ternary "otlp-http" "otlp-grpc" .Values.ingest.otlpHttp.enabled }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml .Values.ingest.authProxy.resources | nindent 12 }}
          volumeMounts:
            - name: authproxy-config
              mountPath: /etc/envoy
              readOnly: true
            - name: authproxy-tls
              mountPath: /etc/icegate/tls
              readOnly: true
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "icegate.componentName" (dict "context" . "component" "ingest") }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.ingest.cache.enabled }}
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.ingest.cache.volumeSizeLimit }}
        {{- end }}
        {{- if .Values.ingest.authProxy.enabled }}
        - name: authproxy-config
          configMap:
            name: {{ include "icegate.componentName" (dict "context" . "component" "ingest-authproxy") }}
        - name: authproxy-tls
          secret:
            secretName: {{ .Values.ingest.authProxy.tls.secretName }}
        {{- end }}
      {{- with .Values.ingest.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingest.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingest.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingest.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
