{{- if .Values.ingest.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "icegate.componentName" (dict "context" . "component" "ingest") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "icegate.componentLabels" (dict "context" . "component" "ingest") | nindent 4 }}
spec:
  replicas: {{ .Values.ingest.replicaCount }}
  selector:
    matchLabels:
      {{- include "icegate.selectorLabels" (dict "context" . "component" "ingest") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-ingest.yaml") . | sha256sum }}
      labels:
        {{- include "icegate.componentLabels" (dict "context" . "component" "ingest") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "icegate.serviceAccountName" . }}
      securityContext:
        {{- include "icegate.podSecurityContext" . | nindent 8 }}
      {{- include "icegate.waitForDeps" (dict "context" . "config" .Values.ingest.waitForDependencies) | nindent 6 }}
      containers:
        - name: ingest
          image: {{ include "icegate.image" (dict "image" .Values.ingest.image "tag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.ingest.image.pullPolicy }}
          command:
            - /usr/local/bin/entrypoint
            - run
            - --config
            - /etc/icegate/ingest.yaml
          securityContext:
            {{- include "icegate.containerSecurityContext" . | nindent 12 }}
          ports:
            {{- /* A loopback bind declares no port: nothing outside the pod can
                   address it, and the name would be taken from the container
                   that does listen there — port names are unique across a pod,
                   and the Service addresses them by name. */}}
            {{- if and .Values.ingest.otlpGrpc.enabled (not (include "icegate.isLoopbackHost" .Values.ingest.otlpGrpc.host)) }}
            - name: otlp-grpc
              containerPort: {{ .Values.ingest.otlpGrpc.port }}
              protocol: TCP
            {{- end }}
            {{- if and .Values.ingest.otlpHttp.enabled (not (include "icegate.isLoopbackHost" .Values.ingest.otlpHttp.host)) }}
            - name: otlp-http
              containerPort: {{ .Values.ingest.otlpHttp.port }}
              protocol: TCP
            {{- end }}
            {{- /* Declared unconditionally: the operational listener runs
                   whatever ingest.metrics.enabled says, because the probes hit
                   /health on it. */}}
            - name: metrics
              containerPort: {{ .Values.ingest.metrics.port }}
              protocol: TCP
          env:
            {{- include "icegate.awsEnv" . | nindent 12 }}
            - name: RUST_LOG
              value: {{ .Values.ingest.rustLog | quote }}
            - name: OTEL_SERVICE_NAME
              value: icegate-ingest
            {{- with .Values.ingest.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.ingest.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ingest.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.ingest.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/icegate
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.ingest.cache.enabled }}
            - name: cache
              mountPath: {{ .Values.ingest.cache.diskDir }}
            {{- end }}
        {{- with .Values.ingest.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "icegate.componentName" (dict "context" . "component" "ingest") }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.ingest.cache.enabled }}
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.ingest.cache.volumeSizeLimit }}
        {{- end }}
        {{- with .Values.ingest.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.ingest.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingest.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingest.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ingest.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
