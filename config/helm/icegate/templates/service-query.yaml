{{- if and .Values.query.enabled (or .Values.query.loki.enabled .Values.query.prometheus.enabled .Values.query.tempo.enabled .Values.query.flightSql.enabled .Values.query.metrics.enabled) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "icegate.componentName" (dict "context" . "component" "query") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "icegate.componentLabels" (dict "context" . "component" "query") | nindent 4 }}
  {{- with .Values.query.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.query.service.type }}
  selector:
    {{- include "icegate.selectorLabels" (dict "context" . "component" "query") | nindent 4 }}
  ports:
    {{- if .Values.query.loki.enabled }}
    - name: loki
      port: {{ .Values.query.loki.port }}
      targetPort: loki
      protocol: TCP
      {{- with include "icegate.appProtocol" (dict "service" .Values.query.service "port" "loki") }}
      {{ . }}
      {{- end }}
    {{- end }}
    {{- if .Values.query.prometheus.enabled }}
    - name: prometheus
      port: {{ .Values.query.prometheus.port }}
      targetPort: prometheus
      protocol: TCP
      {{- with include "icegate.appProtocol" (dict "service" .Values.query.service "port" "prometheus") }}
      {{ . }}
      {{- end }}
    {{- end }}
    {{- if .Values.query.tempo.enabled }}
    - name: tempo
      port: {{ .Values.query.tempo.port }}
      targetPort: tempo
      protocol: TCP
      {{- with include "icegate.appProtocol" (dict "service" .Values.query.service "port" "tempo") }}
      {{ . }}
      {{- end }}
    {{- end }}
    {{- if .Values.query.flightSql.enabled }}
    - name: flight-sql
      port: {{ .Values.query.flightSql.port }}
      targetPort: flight-sql
      protocol: TCP
      {{- with include "icegate.appProtocol" (dict "service" .Values.query.service "port" "flightSql") }}
      {{ . }}
      {{- end }}
    {{- end }}
    {{- if .Values.query.metrics.enabled }}
    - name: metrics
      port: {{ .Values.query.metrics.port }}
      targetPort: metrics
      protocol: TCP
      {{- with include "icegate.appProtocol" (dict "service" .Values.query.service "port" "metrics") }}
      {{ . }}
      {{- end }}
    {{- end }}
{{- end }}
