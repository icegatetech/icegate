{{- if .Values.maintain.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "icegate.componentName" (dict "context" . "component" "maintain") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "icegate.componentLabels" (dict "context" . "component" "maintain") | nindent 4 }}
data:
  maintain.yaml: |
    catalog:
      {{- include "icegate.catalogYaml" . | nindent 6 }}
    storage:
      {{- include "icegate.storageYaml" . | nindent 6 }}
    compaction:
      logs_enabled: {{ .Values.maintain.compaction.tables.logs }}
      spans_enabled: {{ .Values.maintain.compaction.tables.spans }}
      events_enabled: {{ .Values.maintain.compaction.tables.events }}
      metrics_enabled: {{ .Values.maintain.compaction.tables.metrics }}
      operations_enabled: {{ .Values.maintain.compaction.tables.operations }}
      data:
        target_file_size_bytes: {{ .Values.maintain.compaction.data.targetFileSizeBytes | int }}
        max_group_input_bytes: {{ .Values.maintain.compaction.data.maxGroupInputBytes | int }}
        min_input_files: {{ .Values.maintain.compaction.data.minInputFiles }}
        max_skippable_tail_files: {{ .Values.maintain.compaction.data.maxSkippableTailFiles }}
        max_merge_size_ratio: {{ .Values.maintain.compaction.data.maxMergeSizeRatio }}
        rewrite_timeout_secs: {{ .Values.maintain.compaction.data.rewriteTimeoutSecs }}
        row_group_size: {{ .Values.maintain.compaction.data.rowGroupSize }}
        data_page_size_limit_bytes: {{ .Values.maintain.compaction.data.dataPageSizeLimitBytes | int }}
      manifest:
        target_size_bytes: {{ .Values.maintain.compaction.manifest.targetSizeBytes | int }}
        candidate_size_ratio: {{ .Values.maintain.compaction.manifest.candidateSizeRatio }}
        max_manifests_per_commit: {{ .Values.maintain.compaction.manifest.maxManifestsPerCommit }}
        rewrite_timeout_secs: {{ .Values.maintain.compaction.manifest.rewriteTimeoutSecs }}
      jobsmanager:
        scan_interval_secs: {{ .Values.maintain.compaction.jobsmanager.scanIntervalSecs }}
        worker_count: {{ .Values.maintain.compaction.jobsmanager.workerCount }}
        poll_interval_ms: {{ .Values.maintain.compaction.jobsmanager.pollIntervalMs }}
        storage:
          endpoint: {{ .Values.maintain.compaction.jobsmanager.storage.endpoint | default .Values.storage.s3.endpoint | quote }}
          bucket: {{ .Values.maintain.compaction.jobsmanager.storage.bucket | quote }}
          prefix: {{ .Values.maintain.compaction.jobsmanager.storage.prefix | quote }}
          region: {{ .Values.maintain.compaction.jobsmanager.storage.region | default .Values.aws.region | quote }}
          use_ssl: {{ .Values.maintain.compaction.jobsmanager.storage.useSsl }}
          job_state_codec: {{ .Values.maintain.compaction.jobsmanager.storage.jobStateCodec }}
          request_timeout_secs: {{ .Values.maintain.compaction.jobsmanager.storage.requestTimeoutSecs }}
    gc:
      enabled: {{ .Values.maintain.gc.enabled }}
      logs_enabled: {{ .Values.maintain.gc.tables.logs }}
      spans_enabled: {{ .Values.maintain.gc.tables.spans }}
      events_enabled: {{ .Values.maintain.gc.tables.events }}
      metrics_enabled: {{ .Values.maintain.gc.tables.metrics }}
      operations_enabled: {{ .Values.maintain.gc.tables.operations }}
      orphans:
        enabled: {{ .Values.maintain.gc.orphans.enabled }}
        dry_run: {{ .Values.maintain.gc.orphans.dryRun }}
        min_age_secs: {{ .Values.maintain.gc.orphans.minAgeSecs }}
        include_metadata: {{ .Values.maintain.gc.orphans.includeMetadata }}
        delete_concurrency: {{ .Values.maintain.gc.orphans.deleteConcurrency }}
        sweep_timeout_secs: {{ .Values.maintain.gc.orphans.sweepTimeoutSecs }}
      jobsmanager:
        scan_interval_secs: {{ .Values.maintain.gc.jobsmanager.scanIntervalSecs }}
        worker_count: {{ .Values.maintain.gc.jobsmanager.workerCount }}
        poll_interval_ms: {{ .Values.maintain.gc.jobsmanager.pollIntervalMs }}
        storage:
          endpoint: {{ .Values.maintain.gc.jobsmanager.storage.endpoint | default .Values.storage.s3.endpoint | quote }}
          bucket: {{ .Values.maintain.gc.jobsmanager.storage.bucket | quote }}
          prefix: {{ .Values.maintain.gc.jobsmanager.storage.prefix | quote }}
          region: {{ .Values.maintain.gc.jobsmanager.storage.region | default .Values.aws.region | quote }}
          use_ssl: {{ .Values.maintain.gc.jobsmanager.storage.useSsl }}
          job_state_codec: {{ .Values.maintain.gc.jobsmanager.storage.jobStateCodec }}
          request_timeout_secs: {{ .Values.maintain.gc.jobsmanager.storage.requestTimeoutSecs }}
    pricing:
      enabled: {{ .Values.maintain.pricing.enabled }}
      interval_secs: {{ .Values.maintain.pricing.intervalSecs }}
      timeout_secs: {{ .Values.maintain.pricing.timeoutSecs }}
      crawl_timeout_secs: {{ .Values.maintain.pricing.crawlTimeoutSecs }}
      max_change_ratio: {{ .Values.maintain.pricing.maxChangeRatio }}
      min_model_count_ratio: {{ .Values.maintain.pricing.minModelCountRatio }}
      max_response_bytes: {{ .Values.maintain.pricing.maxResponseBytes | int }}
      billing_region:
        {{- toYaml .Values.maintain.pricing.billingRegion | nindent 8 }}
      sources:
        {{- toYaml .Values.maintain.pricing.sources | nindent 8 }}
      jobsmanager:
        scan_interval_secs: {{ .Values.maintain.pricing.jobsmanager.scanIntervalSecs }}
        worker_count: {{ .Values.maintain.pricing.jobsmanager.workerCount }}
        poll_interval_ms: {{ .Values.maintain.pricing.jobsmanager.pollIntervalMs }}
        storage:
          endpoint: {{ .Values.maintain.pricing.jobsmanager.storage.endpoint | default .Values.storage.s3.endpoint | quote }}
          bucket: {{ .Values.maintain.pricing.jobsmanager.storage.bucket | quote }}
          prefix: {{ .Values.maintain.pricing.jobsmanager.storage.prefix | quote }}
          region: {{ .Values.maintain.pricing.jobsmanager.storage.region | default .Values.aws.region | quote }}
          use_ssl: {{ .Values.maintain.pricing.jobsmanager.storage.useSsl }}
          job_state_codec: {{ .Values.maintain.pricing.jobsmanager.storage.jobStateCodec }}
          request_timeout_secs: {{ .Values.maintain.pricing.jobsmanager.storage.requestTimeoutSecs }}
    metrics:
      enabled: {{ .Values.maintain.metrics.enabled }}
      host: "0.0.0.0"
      port: {{ .Values.maintain.metrics.port }}
      path: {{ .Values.maintain.metrics.path | quote }}
    tracing:
      enabled: {{ .Values.maintain.tracing.enabled }}
      {{- if .Values.maintain.tracing.enabled }}
      {{/* Guarded rather than optional (as in configmap-ingest): the run service
           refuses to start without an endpoint, so a missing one is better caught
           at `helm install` than as a CrashLoopBackOff. */}}
      otlp_endpoint: {{ required "maintain.tracing.otlpEndpoint is required when maintain.tracing.enabled is true: the maintain run service refuses to start without an OTLP endpoint" .Values.maintain.tracing.otlpEndpoint | quote }}
      {{- end }}
      sample_ratio: {{ .Values.maintain.tracing.sampleRatio }}
{{- end }}
