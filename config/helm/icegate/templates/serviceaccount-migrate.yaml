{{- if and .Values.migrate.enabled .Values.serviceAccount.create -}}
{{- $name := include "icegate.migrateServiceAccountName" . }}
{{- if eq (include "icegate.serviceAccountName" .) $name }}
{{- fail (printf "serviceAccount.name %s is also the name of the ServiceAccount the migrate Job runs as, a hook Helm recreates on every upgrade, and the Deployments' tokens would stop validating with it: choose another name" $name) }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "icegate.componentLabels" (dict "context" . "component" "migrate") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": {{ .Values.migrate.hookDeletePolicy }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
