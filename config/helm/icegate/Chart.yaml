apiVersion: v2
name: icegate
description: >-
  IceGate is an observability data lake engine that stores logs, traces,
  metrics, and events in Apache Iceberg tables with DataFusion as the query
  engine. Data is ingested via OpenTelemetry protocol and queried via
  Loki- and Tempo-compatible APIs plus Arrow Flight SQL.
type: application
# `version` and `appVersion` are placeholders: .github/workflows/release.yml rewrites both
# with sed from the git tag before packaging, so editing them here changes nothing at release.
version: 0.2.0
appVersion: "0.2.0"
# The product site, not the repo: `home` is the link Artifact Hub renders as the package's
# homepage, and `icon` is fetched from this host on Artifact Hub's own schedule. Both must
# resolve on icegate.tech before the repository is registered, or the listing ships a broken
# icon — the assets live in triplecloud/triple-ui `apps/icegate/public/`, so that app has to be
# deployed to this domain first. `sources` still points at the code.
home: https://icegate.tech
icon: https://icegate.tech/logo.png
sources:
  - https://github.com/icegatetech/icegate
maintainers:
  - name: icegatetech
    url: https://github.com/icegatetech
annotations:
  # Rendered by Artifact Hub as the package's category, license badge and link list. Values and
  # formats per artifacthub.io/docs/topics/annotations/helm — `links` is a YAML *string*, and
  # the name `support` is special (Artifact Hub gives it its own button).
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: documentation
      url: https://docs.icegate.tech
    - name: source
      url: https://github.com/icegatetech/icegate
    - name: support
      url: https://github.com/icegatetech/icegate/issues
  # Drives Artifact Hub's Trivy scan and the security rating badge — without it no
  # security report is produced at all. The four entries must stay in step with the
  # bake targets in config/docker/docker-bake.hcl; `make helm-metadata-test` asserts
  # this. The tags match appVersion and are rewritten by .github/workflows/release.yml
  # at tag time, like `version` and `appVersion` above.
  artifacthub.io/images: |
    - name: query
      image: ghcr.io/icegatetech/icegate-query:0.2.0
      platforms:
        - linux/amd64
        - linux/arm64
    - name: ingest
      image: ghcr.io/icegatetech/icegate-ingest:0.2.0
      platforms:
        - linux/amd64
        - linux/arm64
    - name: maintain
      image: ghcr.io/icegatetech/icegate-maintain:0.2.0
      platforms:
        - linux/amd64
        - linux/arm64
    - name: catalog
      image: ghcr.io/icegatetech/icegate-catalog:0.2.0
      platforms:
        - linux/amd64
        - linux/arm64
  # A curated changelog for chart consumers, maintained by hand and covering only the
  # version being released. Deliberately not generated from git log: the GitHub release
  # notes already carry the full commit list, so this lists only what changes the
  # chart's own behaviour or values.
  artifacthub.io/changes: |
    - kind: changed
      description: Default catalog backend is now s3, the catalog this project ships itself
    - kind: changed
      description: catalog.rest.uri has no default and is required when catalog.backend=rest
    - kind: added
      description: Maintain component running compaction, snapshot expiry, orphan-file GC and WAL cleanup
    - kind: added
      description: Optional read-only Iceberg REST catalog server, off by default
    - kind: added
      description: Values schema, so chart values are browsable and validated on install
    - kind: added
      description: Chart README with install, configuration and catalog-backend guidance
    - kind: security
      description: Component images rebuilt on a distroless base, clearing all critical and high CVEs
    - kind: changed
      description: waitForDependencies images bumped to busybox 1.38.0 and aws-cli 2.36.34
  # Rewritten by .github/workflows/release.yml from the tag: a tag containing a hyphen
  # is a prerelease. Editing it here changes nothing at release time.
  artifacthub.io/prerelease: "false"
  # Shown when the INSTALL button on the package page is clicked.
  artifacthub.io/install: |
    ```bash
    helm install icegate oci://ghcr.io/icegatetech/charts/icegate
    ```
  # Packages a user of this chart also needs, and that this repo already deploys
  # alongside IceGate (see config/kustomize/base/otel-collector and the grafana
  # service in config/docker/docker-compose.yml). Both URLs were verified to return
  # 200 from the Artifact Hub API: an unresolvable one renders as a broken
  # recommendation on the package page.
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/opentelemetry-helm/opentelemetry-collector
    - url: https://artifacthub.io/packages/helm/grafana/grafana
# Discovery terms on Artifact Hub. `prometheus` is deliberately absent: the routes are mounted
# but every handler returns 501, so listing it here would surface this chart for a query it
# cannot answer. Add it back with the implementation, not before.
keywords:
  - observability
  - iceberg
  - lakehouse
  - data-lake
  - datafusion
  - parquet
  - opentelemetry
  - logs
  - traces
  - metrics
  - loki
  - tempo
  - flight-sql
  - rust
